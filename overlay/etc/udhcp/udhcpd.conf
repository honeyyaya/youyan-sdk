interface wlan0

# IP 地址池范围
start           192.168.10.100
end             192.168.10.200

# 租约文件（记录已分配的 IP）
lease_file      /var/lib/misc/udhcpd.leases

# 最大租期（秒），0 表示无限（不推荐）
max_leases      100
remaining       yes

# 自动保存租约
auto_time       30
decline_time    30
conflict_time   30
offer_time      60
min_lease       60

# 网关（必须是你 wlan0 的 IP）
opt router      192.168.10.1

# DNS 服务器
opt dns         8.8.8.8 114.114.114.114

# 子网掩码
opt subnet      255.255.255.0

# （可选）广播地址
opt broadcast   192.168.10.255

# （可选）域名
opt domain      local
