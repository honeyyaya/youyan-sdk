interface=wlan0
driver=nl80211
ssid=YouYan_CV610_AP
country_code=US  # 根据您的国家设置

# 无线模式设置
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# 安全设置
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=12345678
rsn_pairwise=CCMP
wpa_pairwise=CCMP

# 802.11n 设置
ht_capab=[HT20][SHORT-GI-20]

# 控制接口（可选）
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# 其他优化
ignore_broadcast_ssid=0
max_num_sta=10
